<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Mi Vitrina</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-nav { width: 240px; background: var(--secondary); color: #fff; padding: 20px 0; flex-shrink: 0; }
    .admin-nav .logo { padding: 0 20px 20px; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; }
    .admin-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; cursor: pointer; }
    .admin-nav a:hover, .admin-nav a.active { background: rgba(255,153,0,0.2); color: #fff; }
    .admin-nav a i { width: 20px; color: var(--primary); }
    .admin-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .admin-content { padding: 24px; flex: 1; overflow: auto; }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: var(--bg); font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-card); border-radius: 12px; padding: 18px; border: 1px solid var(--border); }
    .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px; }
    .stat-card .num { font-size: 1.6rem; font-weight: 700; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #111; font-weight: 600; }
    .btn-danger { background: var(--danger); color: #fff; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; }
    .form-group input, .form-group textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); color: var(--text); }
    @media (max-width: 768px) {
      .admin-layout { flex-direction: column; }
      .admin-nav { width: 100%; display: flex; flex-wrap: wrap; padding: 10px; gap: 4px; }
      .admin-nav .logo { width: 100%; border: none; margin: 0; padding: 8px; }
      .admin-nav a { padding: 8px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <nav class="admin-nav">
      <div class="logo"><i class="fas fa-shield-alt"></i> Admin Panel</div>
      <a class="active" data-section="dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
      <a data-section="users"><i class="fas fa-users"></i> Usuarios</a>
      <a data-section="sellers"><i class="fas fa-store"></i> Solicitudes Vendedor</a>
      <a data-section="managers"><i class="fas fa-handshake"></i> Gestores</a>
      <a data-section="stores"><i class="fas fa-shop"></i> Tiendas</a>
      <a data-section="orders"><i class="fas fa-shopping-bag"></i> Pedidos</a>
      <a href="index.html" style="margin-top:20px"><i class="fas fa-arrow-left"></i> Volver a la web</a>
    </nav>
    <div class="admin-main">
      <header class="admin-header">
        <h2 id="sectionTitle">Dashboard</h2>
        <div>
          <span style="color:var(--text-muted);font-size:0.85rem">Admin:</span>
          <strong id="adminName">—</strong>
        </div>
      </header>
      <div class="admin-content">
        <section id="sec-dashboard" class="admin-section active">
          <div class="stats" id="dashStats"></div>
        </section>
        <section id="sec-users" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Teléfono</th><th>Edad</th></tr></thead><tbody id="usersBody"></tbody></table></div>
        </section>
        <section id="sec-sellers" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Tienda</th><th>Categoría</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="requestsBody"></tbody></table></div>
        </section>
        <section id="sec-managers" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="managersBody"></tbody></table></div>
        </section>
        <section id="sec-stores" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Slug</th><th>Categoría</th><th>Estado</th></tr></thead><tbody id="storesBody"></tbody></table></div>
        </section>
        <section id="sec-orders" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>ID</th><th>Total</th><th>Estado</th><th>Pago</th><th>Fecha</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
        </section>
      </div>
    </div>
  </div>
  <div id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function toast(msg, type='') {
      const c = document.getElementById('toastContainer');
      if (!c) return alert(msg);
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      el.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#333;color:#fff;padding:12px 16px;border-radius:8px;z-index:9999';
      if (type==='success') el.style.background = '#28a745';
      if (type==='error') el.style.background = '#dc3545';
      c.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
    function formatPrice(n) { return (window.CONFIG?.CURRENCY_SYMBOL||'$') + Number(n).toLocaleString('es-CO'); }
    async function init() {
      await Auth.init();
      if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
        alert('Solo el administrador puede acceder');
        location.href = 'index.html';
        return;
      }
      document.getElementById('adminName').textContent = Auth.getUser().email;
      document.querySelectorAll('.admin-nav a[data-section]').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          document.querySelectorAll('.admin-nav a[data-section]').forEach(x => x.classList.remove('active'));
          a.classList.add('active');
          document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
          const sec = document.getElementById('sec-' + a.dataset.section);
          if (sec) sec.classList.add('active');
          document.getElementById('sectionTitle').textContent = a.textContent.trim();
          if (a.dataset.section === 'users') renderUsers();
          if (a.dataset.section === 'sellers') renderRequests();
          if (a.dataset.section === 'managers') renderManagers();
          if (a.dataset.section === 'stores') renderStores();
          if (a.dataset.section === 'orders') renderOrders();
          if (a.dataset.section === 'dashboard') renderDashboard();
        });
      });
      renderDashboard();
    }
    async function renderDashboard() {
      const stats = document.getElementById('dashStats');
      const [users, stores, orders, reqs] = await Promise.all([
        sb.from('profiles').select('id', { count: 'exact', head: true }),
        sb.from('stores').select('id', { count: 'exact', head: true }),
        sb.from('orders').select('id', { count: 'exact', head: true }),
        sb.from('seller_requests').select('id', { count: 'exact', head: true }).eq('status', 'pendiente'),
      ]);
      stats.innerHTML = `
        <div class="stat-card"><h3>Usuarios</h3><div class="num">${users.count??0}</div></div>
        <div class="stat-card"><h3>Tiendas</h3><div class="num">${stores.count??0}</div></div>
        <div class="stat-card"><h3>Pedidos</h3><div class="num">${orders.count??0}</div></div>
        <div class="stat-card"><h3>Solicitudes pendientes</h3><div class="num">${reqs.count??0}</div></div>`;
    }
    async function renderUsers() {
      const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(200);
      const tbody = document.getElementById('usersBody');
      if (!data?.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Sin usuarios</td></tr>'; return; }
      tbody.innerHTML = data.map(u => `<tr>
        <td>${u.full_name||'—'}</td><td>${u.email||'—'}</td><td>${u.role||'customer'}</td>
        <td>${u.phone||'—'}</td><td>${u.age??'—'}</td></tr>`).join('');
    }
    async function renderRequests() {
      const { data } = await sb.from('seller_requests').select('*, profiles(full_name, email, age, phone)').order('created_at', { ascending: false });
      const tbody = document.getElementById('requestsBody');
      if (!data?.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">Sin solicitudes</td></tr>'; return; }
      tbody.innerHTML = data.map(r => `<tr>
        <td>${r.profiles?.full_name||'—'}<br><small>${r.profiles?.email||''}</small></td>
        <td>${r.store_name||'—'}</td><td>${r.category||'—'}</td>
        <td>${new Date(r.created_at).toLocaleDateString('es-CO')}</td>
        <td>${r.status}</td>
        <td>${r.status==='pendiente'?`
          <button class="btn-sm btn-primary" onclick="approveSeller('${r.id}','${r.user_id}','${(r.store_name||'').replace(/'/g,'')}')">Aprobar</button>
          <button class="btn-sm btn-danger" onclick="rejectSeller('${r.id}')">Rechazar</button>`:r.status}
        </td></tr>`).join('');
    }
    async function renderManagers() {
      const { data } = await sb.from('manager_requests').select('*, profiles(full_name, email)').order('created_at', { ascending: false });
      const tbody = document.getElementById('managersBody');
      if (!data?.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Sin solicitudes</td></tr>'; return; }
      tbody.innerHTML = data.map(r => `<tr>
        <td>${r.profiles?.full_name||'—'} (${r.profiles?.email||''})</td>
        <td>${new Date(r.created_at).toLocaleDateString('es-CO')}</td>
        <td>${r.status}</td>
        <td>${r.status==='pendiente'?`
          <button class="btn-sm btn-primary" onclick="approveManager('${r.id}','${r.user_id}')">Aprobar</button>
          <button class="btn-sm btn-danger" onclick="rejectManager('${r.id}')">Rechazar</button>`:r.status}
        </td></tr>`).join('');
    }
    async function renderStores() {
      const { data } = await sb.from('stores').select('*').order('created_at', { ascending: false });
      const tbody = document.getElementById('storesBody');
      if (!data?.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Sin tiendas</td></tr>'; return; }
      tbody.innerHTML = data.map(s => `<tr>
        <td>${s.name}</td><td>${s.slug||'—'}</td><td>${s.category||'—'}</td>
        <td>${s.active?'Activa':'Inactiva'}</td></tr>`).join('');
    }
    async function renderOrders() {
      const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(100);
      const tbody = document.getElementById('ordersBody');
      if (!data?.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Sin pedidos</td></tr>'; return; }
      tbody.innerHTML = data.map(o => `<tr>
        <td>#${String(o.id).slice(-8)}</td>
        <td>${formatPrice(o.total)}</td>
        <td>${o.status}</td>
        <td>${o.payment_status||'—'}</td>
        <td>${new Date(o.created_at).toLocaleDateString('es-CO')}</td></tr>`).join('');
    }
    window.approveSeller = async function(reqId, userId, storeName) {
      await sb.from('seller_requests').update({ status: 'aprobado', reviewed_at: new Date().toISOString(), reviewed_by: Auth.getUser().id }).eq('id', reqId);
      await sb.from('profiles').update({ role: 'seller' }).eq('id', userId);
      const { data: existing } = await sb.from('stores').select('id').eq('owner_id', userId).maybeSingle();
      if (!existing) {
        const slug = (storeName||'tienda').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) + '-' + Date.now().toString(36).slice(-4);
        await sb.from('stores').insert({ owner_id: userId, name: storeName || 'Mi Tienda', slug, active: true });
      }
      toast('Vendedor aprobado', 'success');
      renderRequests();
      renderDashboard();
    };
    window.rejectSeller = async function(reqId) {
      await sb.from('seller_requests').update({ status: 'rechazado', reviewed_at: new Date().toISOString(), reviewed_by: Auth.getUser().id }).eq('id', reqId);
      toast('Rechazado');
      renderRequests();
    };
    window.approveManager = async function(reqId, userId) {
      await sb.from('manager_requests').update({ status: 'aprobado', reviewed_at: new Date().toISOString(), reviewed_by: Auth.getUser().id }).eq('id', reqId);
      await sb.from('profiles').update({ role: 'manager', is_manager: true }).eq('id', userId);
      toast('Gestor aprobado', 'success');
      renderManagers();
    };
    window.rejectManager = async function(reqId) {
      await sb.from('manager_requests').update({ status: 'rechazado', reviewed_at: new Date().toISOString() }).eq('id', reqId);
      toast('Rechazado');
      renderManagers();
    };
    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script src="js/admin-home.js"></script>
</body>
</html>
