<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Panel Admin - Mi Vitrina</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style id="admin-modern">
    :root {
      --adm-bg: #f3f4f6;
      --adm-card: #ffffff;
      --adm-ink: #111827;
      --adm-muted: #6b7280;
      --adm-border: #e5e7eb;
      --adm-primary: #ff7a00;
      --adm-side: #0f172a;
    }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--adm-bg); color: var(--adm-ink); }
    .admin-layout { display: flex; min-height: 100vh; flex-direction: column; }
    .admin-nav {
      width: 100%; background: var(--adm-side); color: #fff;
      display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      position: sticky; bottom: 0; z-index: 50;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    }
    .admin-nav .logo { display: none; }
    .admin-nav a {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; min-width: 68px; padding: 8px 10px; border-radius: 12px;
      color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.65rem; font-weight: 600;
      white-space: nowrap; cursor: pointer; flex-shrink: 0;
    }
    .admin-nav a i { font-size: 1.15rem; color: var(--adm-primary); }
    .admin-nav a:hover, .admin-nav a.active { background: rgba(255,122,0,0.18); color: #fff; }
    .admin-main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding-bottom: 72px; }
    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--adm-card);
      border-bottom: 1px solid var(--adm-border);
      position: sticky; top: 0; z-index: 40;
    }
    .admin-header h1 { margin: 0; font-size: 1.15rem; }
    .admin-content { padding: 14px; flex: 1; }
    .admin-section { display: none; }
    .admin-section.active { display: block; animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: var(--adm-card); border-radius: 16px; padding: 16px;
      border: 1px solid var(--adm-border); box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .stat-card h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--adm-muted); margin: 0 0 8px; font-weight: 600; }
    .stat-card .num { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; }
    .table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--adm-border); background: var(--adm-card); }
    table { width: 100%; border-collapse: collapse; min-width: 480px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--adm-border); font-size: 0.85rem; }
    th { background: #f9fafb; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--adm-muted); }
    tr:last-child td { border-bottom: none; }
    .btn-sm { padding: 8px 12px; font-size: 0.8rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
    .btn-primary { background: linear-gradient(135deg,#ff9a3c,#ff6a00); color: #111; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; }
    input, textarea, select {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--adm-border);
      font-size: 16px; background: #fff; box-sizing: border-box;
    }
    @media (min-width: 900px) {
      .admin-layout { flex-direction: row; }
      .admin-nav {
        width: 240px; flex-direction: column; flex-wrap: nowrap; overflow: visible;
        position: sticky; top: 0; bottom: auto; height: 100vh; padding: 20px 0;
        box-shadow: none;
      }
      .admin-nav .logo {
        display: block; padding: 0 20px 20px; font-weight: 800; font-size: 1.1rem;
        border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px;
      }
      .admin-nav a {
        flex-direction: row; min-width: 0; padding: 12px 20px; font-size: 0.9rem;
        border-radius: 0; justify-content: flex-start; gap: 12px;
      }
      .admin-nav a i { width: 22px; font-size: 1rem; }
      .admin-main { padding-bottom: 0; }
      .admin-content { padding: 24px; }
      .stats { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-main">
      <header class="admin-header">
        <h1 id="secTitle">Dashboard</h1>
        <div style="font-size:0.8rem;color:var(--adm-muted)">Admin: <strong id="adminName" style="color:var(--adm-ink)">—</strong></div>
      </header>
      <div class="admin-content">
        <section id="sec-dashboard" class="admin-section active">
          <div class="stats" id="dashStats"></div>
        </section>
        <section id="sec-users" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Alta</th></tr></thead><tbody id="usersBody"></tbody></table></div>
        </section>
        <section id="sec-sellers" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Tienda</th><th>Usuario</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="sellersBody"></tbody></table></div>
        </section>
        <section id="sec-managers" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="managersBody"></tbody></table></div>
        </section>
        <section id="sec-stores" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Slug</th><th>Verificada</th><th>Activa</th></tr></thead><tbody id="storesBody"></tbody></table></div>
        </section>
        <section id="sec-announce" class="admin-section">
          <h2 style="margin-top:0">Anuncio a todos</h2>
          <p style="color:var(--adm-muted);margin-bottom:16px">Notificación interna (texto o imagen + texto).</p>
          <div style="max-width:520px;background:var(--adm-card);padding:20px;border-radius:16px;border:1px solid var(--adm-border)">
            <div class="form-group" style="margin-bottom:12px"><label>Título *</label><input type="text" id="annTitle" placeholder="Título del anuncio"></div>
            <div class="form-group" style="margin-bottom:12px"><label>Mensaje</label><textarea id="annBody" rows="3" placeholder="Texto"></textarea></div>
            <div class="form-group" style="margin-bottom:12px"><label>Imagen (opcional)</label><input type="file" id="annImage" accept="image/*"></div>
            <button type="button" class="btn-sm btn-primary" id="btnSendAnn">Enviar a todos</button>
          </div>
        </section>
        <section id="sec-orders" class="admin-section">
          <div class="table-wrap"><table><thead><tr><th>ID</th><th>Total</th><th>Estado</th><th>Pago</th><th>Fecha</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
        </section>
        <section id="sec-home" class="admin-section">
          <div id="homeEditor"></div>
        </section>
      </div>
    </div>
    <nav class="admin-nav">
      <div class="logo">Mi Vitrina Admin</div>
      <a data-section="dashboard" class="active"><i class="fas fa-chart-line"></i> Inicio</a>
      <a data-section="users"><i class="fas fa-users"></i> Users</a>
      <a data-section="sellers"><i class="fas fa-store"></i> Vendedores</a>
      <a data-section="managers"><i class="fas fa-handshake"></i> Gestores</a>
      <a data-section="stores"><i class="fas fa-shop"></i> Tiendas</a>
      <a data-section="orders"><i class="fas fa-box"></i> Pedidos</a>
      <a data-section="announce"><i class="fas fa-bullhorn"></i> Anuncios</a>
      <a data-section="home"><i class="fas fa-palette"></i> Apariencia</a>
      <a href="/"><i class="fas fa-arrow-left"></i> Salir</a>
    </nav>
  </div>
  <div id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/ensure-client.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function toast(msg, type) {
      const c = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.textContent = msg;
      el.style.cssText = 'position:relative;margin-bottom:8px;padding:12px 16px;border-radius:10px;background:'+(type==='success'?'#1e2a22':'#1a1a1a')+';color:#fff;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.25)';
      c.style.cssText = 'position:fixed;top:16px;right:16px;z-index:99999';
      c.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
    function formatPrice(n) { return '$' + Number(n||0).toLocaleString('es-CU'); }

    async function init() {
      if (typeof ensureClient === 'function') await ensureClient(8000);
      for (let i = 0; i < 6; i++) {
        await Auth.init();
        if (Auth.isLoggedIn()) break;
        await new Promise(r => setTimeout(r, 250));
      }
      const u = Auth.getUser();
      const adminEmail = (window.CONFIG && CONFIG.ADMIN_EMAIL || 'guillers240@gmail.com').toLowerCase();
      if (u && u.email && u.email.toLowerCase() === adminEmail) {
        u.role = 'admin';
        Auth.currentUser = u;
      }
      if (!Auth.isLoggedIn() || !Auth.isAdmin()) {
        toast(!Auth.isLoggedIn() ? 'Debes iniciar sesión como administrador' : 'Solo guillers240@gmail.com puede acceder', 'error');
        setTimeout(() => { location.href = '/'; }, 1400);
        return;
      }
      document.getElementById('adminName').textContent = Auth.getUser().email;
      document.querySelectorAll('.admin-nav a[data-section]').forEach(a => {
        a.addEventListener('click', () => {
          document.querySelectorAll('.admin-nav a[data-section]').forEach(x => x.classList.remove('active'));
          a.classList.add('active');
          document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
          const sec = document.getElementById('sec-' + a.dataset.section);
          if (sec) sec.classList.add('active');
          document.getElementById('secTitle').textContent = a.textContent.trim();
          if (a.dataset.section === 'dashboard') renderDashboard();
          if (a.dataset.section === 'users') renderUsers();
          if (a.dataset.section === 'sellers') renderRequests();
          if (a.dataset.section === 'managers') renderManagers();
          if (a.dataset.section === 'stores') renderStores();
          if (a.dataset.section === 'orders') renderOrders();
        });
      });
      renderDashboard();
    }

    async function renderDashboard() {
      const [users, stores, products, orders, pending] = await Promise.all([
        sb.from('profiles').select('id', { count: 'exact', head: true }),
        sb.from('stores').select('id', { count: 'exact', head: true }),
        sb.from('products').select('id', { count: 'exact', head: true }),
        sb.from('orders').select('id', { count: 'exact', head: true }),
        sb.from('seller_requests').select('id', { count: 'exact', head: true }).eq('status', 'pendiente'),
      ]);
      document.getElementById('dashStats').innerHTML = [
        ['Usuarios', users.count||0],
        ['Tiendas', stores.count||0],
        ['Productos', products.count||0],
        ['Pedidos', orders.count||0],
        ['Solicitudes', pending.count||0],
      ].map(([h,n]) => `<div class="stat-card"><h3>${h}</h3><div class="num">${n}</div></div>`).join('');
    }

    async function renderUsers() {
      const { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(100);
      document.getElementById('usersBody').innerHTML = (data||[]).map(u =>
        `<tr><td>${u.full_name||'—'}</td><td>${u.email||''}</td><td>${u.role}</td><td>${u.created_at?new Date(u.created_at).toLocaleDateString('es'):'—'}</td></tr>`
      ).join('') || '<tr><td colspan="4">Sin usuarios</td></tr>';
    }

    async function renderRequests() {
      const { data } = await sb.from('seller_requests').select('*, profiles(full_name,email)').order('created_at', { ascending: false });
      document.getElementById('sellersBody').innerHTML = (data||[]).map(r =>
        `<tr><td>${r.store_name||'—'}</td><td>${r.profiles?.full_name||r.profiles?.email||r.user_id}</td><td>${r.status}</td><td>` +
        (r.status==='pendiente' ? `<button class="btn-sm btn-primary" onclick="approveSeller('${r.id}','${r.user_id}','${(r.store_name||'').replace(/'/g,"")}');">Aprobar</button> <button class="btn-sm btn-danger" onclick="rejectSeller('${r.id}')">Rechazar</button>` : '—') +
        `</td></tr>`
      ).join('') || '<tr><td colspan="4">Sin solicitudes</td></tr>';
    }

    async function renderManagers() {
      const { data } = await sb.from('manager_requests').select('*, profiles(full_name,email)').order('created_at', { ascending: false });
      document.getElementById('managersBody').innerHTML = (data||[]).map(r =>
        `<tr><td>${r.profiles?.full_name||r.profiles?.email||r.user_id}</td><td>${r.status}</td><td>` +
        (r.status==='pendiente' ? `<button class="btn-sm btn-primary" onclick="approveManager('${r.id}','${r.user_id}')">Aprobar</button> <button class="btn-sm btn-danger" onclick="rejectManager('${r.id}')">Rechazar</button>` : '—') +
        `</td></tr>`
      ).join('') || '<tr><td colspan="3">Sin solicitudes</td></tr>';
    }

    async function renderStores() {
      const { data } = await sb.from('stores').select('*').order('name');
      document.getElementById('storesBody').innerHTML = (data||[]).map(s =>
        `<tr><td>${s.name} ${s.membership==='vip'||s.membership==='premium'?'★':s.verified?'✓':''}</td><td>${s.slug||'—'}</td><td>${s.verified?'Sí':'No'}</td><td>${s.active?'Sí':'No'}</td></tr>`
      ).join('') || '<tr><td colspan="4">Sin tiendas</td></tr>';
    }

    async function renderOrders() {
      const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(100);
      document.getElementById('ordersBody').innerHTML = (data||[]).map(o =>
        `<tr><td>#${String(o.id).slice(-8)}</td><td>${formatPrice(o.total)}</td><td>${o.status}</td><td>${o.payment_status||'—'}</td><td>${new Date(o.created_at).toLocaleDateString('es')}</td></tr>`
      ).join('') || '<tr><td colspan="5">Sin pedidos</td></tr>';
    }

    window.approveSeller = async function(reqId, userId, storeName) {
      await sb.from('seller_requests').update({ status: 'aprobado', reviewed_at: new Date().toISOString(), reviewed_by: Auth.getUser().id }).eq('id', reqId);
      await sb.from('profiles').update({ role: 'seller' }).eq('id', userId);
      const { data: existing } = await sb.from('stores').select('id').eq('owner_id', userId).maybeSingle();
      if (!existing) {
        const slug = (storeName||'tienda').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) + '-' + Date.now().toString(36).slice(-4);
        await sb.from('stores').insert({ owner_id: userId, name: storeName || 'Mi Tienda', slug, active: true });
      }
      toast('Vendedor aprobado', 'success');
      renderRequests(); renderDashboard();
    };
    window.rejectSeller = async function(reqId) {
      await sb.from('seller_requests').update({ status: 'rechazado', reviewed_at: new Date().toISOString(), reviewed_by: Auth.getUser().id }).eq('id', reqId);
      toast('Rechazado');
      renderRequests();
    };
    window.approveManager = async function(reqId, userId) {
      await sb.from('manager_requests').update({ status: 'aprobado', reviewed_at: new Date().toISOString(), reviewed_by: Auth.getUser().id }).eq('id', reqId);
      await sb.from('profiles').update({ role: 'manager', is_manager: true }).eq('id', userId);
      toast('Gestor aprobado', 'success');
      renderManagers();
    };
    window.rejectManager = async function(reqId) {
      await sb.from('manager_requests').update({ status: 'rechazado', reviewed_at: new Date().toISOString() }).eq('id', reqId);
      toast('Rechazado');
      renderManagers();
    };

    document.getElementById('btnSendAnn')?.addEventListener('click', async () => {
      const title = document.getElementById('annTitle')?.value?.trim();
      const body = document.getElementById('annBody')?.value?.trim() || '';
      if (!title) { toast('Escribe un título', 'error'); return; }
      let image_url = null;
      const file = document.getElementById('annImage')?.files?.[0];
      if (file && window.DataService?.uploadImage) {
        try { image_url = await DataService.uploadImage(file, 'announcements'); } catch (e) { console.warn(e); }
      }
      const { data: ann, error } = await sb.from('announcements').insert({
        title, body, image_url, created_by: Auth.getUser().id, active: true
      }).select().single();
      if (error) { toast(error.message || 'Error', 'error'); return; }
      const { data: users } = await sb.from('profiles').select('id');
      if (users?.length) {
        const rows = users.map(u => ({
          user_id: u.id, title, body: body || title, type: 'announcement',
          data: { announcement_id: ann.id, image_url }
        }));
        for (let i = 0; i < rows.length; i += 80) {
          await sb.from('notifications').insert(rows.slice(i, i + 80));
        }
      }
      toast('Anuncio enviado a ' + (users?.length || 0) + ' usuarios', 'success');
      document.getElementById('annTitle').value = '';
      document.getElementById('annBody').value = '';
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script src="/js/admin-home.js"></script>
</body>
</html>
